name: Apply Stage 3A Build Migration

on:
  push:
    branches:
      - chore/stage-0-baseline

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/stage-0-baseline
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Write verified build.py
        run: python scripts/apply_stage3a.py

      - name: Validate build pipeline
        run: |
          python build.py check
          npm run test
          npm run build:userscript
          npm run build:extension
          npm run build:firefox

      - name: Commit verified build.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: make build pipeline deterministic"
          git push origin HEAD:chore/stage-0-baseline
